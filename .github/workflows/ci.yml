name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: "latest"

      - name: Install fonts
        run: sudo apt-get install -y fonts-ibm-plex

      - name: Install cspell
        run: npm install -g cspell

      - uses: j178/prek-action@v1
        with:
          install-only: true
      - run: make prek-ci
      - run: make spell
      - run: make build-examples
