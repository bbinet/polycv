name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: extractions/setup-just@v3
        with:
          just-version: 1.46.0

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 'latest'

      - name: Run tests
        run: just ci
