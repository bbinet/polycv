name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: "latest"

      - uses: cue-lang/setup-cue@v1.0.1

      - name: Install fonts
        run: |
          sudo apt-get install -y fonts-ibm-plex
          mkdir -p ~/.local/share/fonts
          curl -fsSL -o /tmp/fa.zip \
            https://github.com/FortAwesome/Font-Awesome/releases/download/7.3.1/fontawesome-free-7.3.1-desktop.zip
          unzip -j /tmp/fa.zip 'fontawesome-free-7.3.1-desktop/otfs/*.otf' -d ~/.local/share/fonts
          fc-cache -f

      - name: Install cspell
        run: npm install -g cspell

      - uses: j178/prek-action@v1
        with:
          install-only: true
      - run: make prek-ci
      - run: make spell
      - run: make build-examples
