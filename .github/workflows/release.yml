name: Release and Publish to Typst Packages
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 0.1.0)"
        required: true
        type: string
      dry-run:
        description: "Skip creating the PR (for testing)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${{ github.ref_name }}"
            VERSION=${VERSION#v}
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=polycv-$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          token: ${{ secrets.PAT_TOKEN }}

      - name: Prepare package files
        run: |
          mkdir -p packages/preview/polycv/${{ steps.version.outputs.version }}
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='.gitignore' \
            --exclude='.bumpversion.toml' \
            --exclude='.pre-commit-config.yaml' \
            --exclude='schema' \
            --exclude='justfile' \
            --exclude='Makefile' \
            --exclude='shell.nix' \
            --exclude='cspell.toml' \
            --exclude='CLAUDE.md' \
            --exclude='thumbnail-all.png' \
            --exclude='thumbnail-layouts.png' \
            --exclude='out' \
            --exclude='packages' \
            . packages/preview/polycv/${{ steps.version.outputs.version }}/

      - name: Publish to fork and create PR
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          MAIN_DIR="$(pwd)"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

          gh repo clone bbinet/typst-packages temp-fork -- --depth=1
          cd temp-fork

          BRANCH="${{ steps.version.outputs.branch }}"
          git show-ref --verify --quiet refs/heads/$BRANCH && git branch -D $BRANCH || true
          git ls-remote --heads origin $BRANCH | grep -q $BRANCH && git push origin --delete $BRANCH || true
          git checkout -b "$BRANCH"

          mkdir -p packages/preview/polycv
          cp -r "$MAIN_DIR/packages/preview/polycv/${{ steps.version.outputs.version }}" packages/preview/polycv/

          git add .
          git commit -m "polycv:${{ steps.version.outputs.version }}"
          git push -u origin "$BRANCH"

          if [ "${{ github.event.inputs.dry-run }}" = "true" ]; then
            echo "Dry run — skipping PR creation"
            exit 0
          fi

          gh pr create \
            --repo typst/packages \
            --title "polycv:${{ steps.version.outputs.version }}" \
            --body "I am submitting
          - [X] a new package
          - [ ] an update for a package

          Description: polycv ${{ steps.version.outputs.version }} — a data-driven two-column CV package for Typst.

          I have read and followed the submission guidelines and, in particular, I
          - [X] selected a name that isn't the most obvious or canonical name for what the package does
          - [X] added a \`typst.toml\` file with all required keys
          - [X] added a \`README.md\` with documentation for my package
          - [X] have chosen a license and added a \`LICENSE\` file
          - [X] tested my package locally on my system and it worked
          - [X] \`exclude\`d PDFs or README images, if any, but not the LICENSE
          - [X] ensured that my package is licensed such that users can use and distribute the contents of its template directory without restriction, after modifying them through normal use." \
            --head "bbinet:$BRANCH" \
            --base main
