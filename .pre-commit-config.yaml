repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v9.4.0
    hooks:
      - id: cspell
        args: ["--config", "cspell.toml", "--no-must-find-files"]

  - repo: local
    hooks:
      - id: typstyle
        name: Format Typst files
        entry: typstyle -i
        language: system
        files: \.typ$
        pass_filenames: true

      - id: schema
        name: Regenerate schema.json from schema.cue
        entry: bash -c "make schema"
        language: system
        files: ^schema/schema\.cue$
        pass_filenames: false
