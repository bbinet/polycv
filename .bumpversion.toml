[tool.bumpversion]
current_version = "0.1.0"
commit = true
tag = true
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "typst.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "template/cv.toml"
search = "https://raw.githubusercontent.com/bbinet/polycv/v{current_version}/schema/schema.json"
replace = "https://raw.githubusercontent.com/bbinet/polycv/v{new_version}/schema/schema.json"

[[tool.bumpversion.files]]
filename = "template/letter.toml"
search = "https://raw.githubusercontent.com/bbinet/polycv/v{current_version}/schema/schema.json"
replace = "https://raw.githubusercontent.com/bbinet/polycv/v{new_version}/schema/schema.json"

[[tool.bumpversion.files]]
filename = "template/cv.yml"
search = "https://raw.githubusercontent.com/bbinet/polycv/v{current_version}/schema/schema.json"
replace = "https://raw.githubusercontent.com/bbinet/polycv/v{new_version}/schema/schema.json"

[[tool.bumpversion.files]]
filename = "template/letter.yml"
search = "https://raw.githubusercontent.com/bbinet/polycv/v{current_version}/schema/schema.json"
replace = "https://raw.githubusercontent.com/bbinet/polycv/v{new_version}/schema/schema.json"

[[tool.bumpversion.files]]
filename = "template/cv.typ"
search = "@preview/polycv:{current_version}"
replace = "@preview/polycv:{new_version}"

[[tool.bumpversion.files]]
filename = "template/letter.typ"
search = "@preview/polycv:{current_version}"
replace = "@preview/polycv:{new_version}"

[[tool.bumpversion.files]]
filename = "template/application.typ"
search = "@preview/polycv:{current_version}"
replace = "@preview/polycv:{new_version}"

[[tool.bumpversion.files]]
filename = "README.md"
search = "version-{current_version}-blue"
replace = "version-{new_version}-blue"

[[tool.bumpversion.files]]
filename = "README.md"
search = "@preview/polycv:{current_version}"
replace = "@preview/polycv:{new_version}"
