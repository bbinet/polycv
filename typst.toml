# for a description of available keys, see https://github.com/typst/packages/?tab=readme-ov-file#package-format

[package]
name = "polycv"
version = "0.1.1"
entrypoint = "src/lib.typ"
authors = ["Bruno Binet"]
license = "MIT"
description = "A Typst template package for not-a-boring CV"
repository = "https://github.com/bbinet/polycv"
keywords = ["cv", "resume", "cover-letter", "curriculum-vitae", "two-column", "letter"]
categories = ["cv"]
disciplines = []
compiler = "0.14.0"
exclude = [
  ".github",
  ".claude",
  ".gitignore",
  ".bumpversion.toml",
  "schema",
  "justfile",
  "Makefile",
  "shell.nix",
  "cspell.toml",
  ".pre-commit-config.yaml",
  "CLAUDE.md",
  "thumbnail-all.png",
  "thumbnail-layouts.png",
]

[template]
path = "template"
entrypoint = "cv.typ"
thumbnail = "thumbnail.png"
