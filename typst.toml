# for a description of available keys, see https://github.com/typst/packages/?tab=readme-ov-file#package-format

[package]
name = "nabcv"
version = "0.0.0"
entrypoint = "src/lib.typ"
authors = ["Resul"]
license = "MIT"
description = "A Typst template package for not a boring CV"
homepage = "https://github.com/xrsl/nabcv"
repository = "https://github.com/xrsl/nabcv"
keywords = ["cv", "resume", "toml", "fontawesome"]
categories = ["cv"]
disciplines = []
# compiler = ""
exclude = [
  ".github",
  ".bumpversion.toml",
  "docs",
  "schema",
  "justfile",
  "cspell.toml",
  ".pre-commit-config.yaml",
  ".vscode",
]

[template]
path = "template"
entrypoint = "cv.typ"
thumbnail = "thumbnail.png"
